name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Setup Terraform for Coder provider regression tests
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.15.5
          terraform_wrapper: false

      - name: Install dependencies
        run: bun install

      - name: Lint
        run: bun run lint:ci

      - name: Run tests
        run: bun test

      - name: Verify upstream MLflow authentication, artifacts and restart behavior
        run: |
          python3 -m venv /tmp/mlflow-smoke
          /tmp/mlflow-smoke/bin/python -c 'import json, subprocess; version = json.load(open("apps/mlflow/config.json"))["version"].removeprefix("v").removesuffix("-full"); subprocess.check_call(["/tmp/mlflow-smoke/bin/pip", "install", "mlflow[auth,db]==" + version])'
          /tmp/mlflow-smoke/bin/python tests/platform/mlflow_local.py

  store-tui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Install store validation dependencies
        run: bun install --frozen-lockfile
      - name: Set up Rust
        run: |
          rustup toolchain install stable --profile minimal --component clippy,rustfmt
          rustup default stable
      - name: Check Rust formatting
        run: cargo fmt --manifest-path tools/store-tui/Cargo.toml --check
      - name: Lint Rust
        run: cargo clippy --manifest-path tools/store-tui/Cargo.toml --locked --all-targets -- -D warnings
      - name: Test terminal app and repository workflows
        run: cargo test --manifest-path tools/store-tui/Cargo.toml --locked
