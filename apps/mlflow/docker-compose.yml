x-runtipi:
  schema_version: 2
services:
  mlflow-permissions:
    image: busybox:1.38.0
    network_mode: none
    command: [sh, -ec, 'mkdir -p /data/artifacts; chown 1000:1000 /data /data/artifacts; touch /tmp/ready; while :; do sleep 3600; done']
    volumes:
      - ${APP_DATA_DIR}/server:/data
    healthcheck:
      test: [CMD-SHELL, test -f /tmp/ready]
      interval: 5s
      timeout: 3s
      retries: 12
  mlflow-postgres:
    image: postgres:17.11-bookworm
    environment:
      POSTGRES_DB: mlflow
      POSTGRES_USER: mlflow
      POSTGRES_PASSWORD: ${MLFLOW_DB_PASSWORD}
    volumes:
      - ${APP_DATA_DIR}/postgres:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, pg_isready -U mlflow -d mlflow]
      interval: 5s
      timeout: 5s
      start_period: 30s
      retries: 30
  mlflow:
    image: ghcr.io/mlflow/mlflow:v3.16.1-full
    user: '1000:1000'
    working_dir: /data
    entrypoint: [python, -c, "import base64; exec(compile(base64.b64decode(''), 'mlflow-server.py', 'exec'))"]
    environment:
      HOME: /data
      MLFLOW_DB_PASSWORD: ${MLFLOW_DB_PASSWORD}
      MLFLOW_ADMIN_USERNAME: ${MLFLOW_ADMIN_USERNAME}
      MLFLOW_AUTH_ADMIN_PASSWORD: ${MLFLOW_ADMIN_PASSWORD}
      MLFLOW_FLASK_SERVER_SECRET_KEY: ${MLFLOW_COOKIE_SECRET}
      MLFLOW_ALLOWED_HOSTS: ${MLFLOW_ALLOWED_HOSTS}
      MLFLOW_S3_BUCKET: ${MLFLOW_S3_BUCKET:-}
      MLFLOW_S3_ENDPOINT_URL: ${MLFLOW_S3_ENDPOINT_URL:-}
      AWS_ACCESS_KEY_ID: ${MLFLOW_S3_ACCESS_KEY:-}
      AWS_SECRET_ACCESS_KEY: ${MLFLOW_S3_SECRET_KEY:-}
      AWS_DEFAULT_REGION: ${MLFLOW_S3_REGION:-us-east-1}
      AWS_EC2_METADATA_DISABLED: 'true'
      MLFLOW_DISABLE_TELEMETRY: 'true'
    volumes:
      - ${APP_DATA_DIR}/server:/data
    depends_on:
      mlflow-postgres:
        condition: service_healthy
      mlflow-permissions:
        condition: service_healthy
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      start_period: 60s
      retries: 30
    x-runtipi:
      is_main: true
      internal_port: 5000
