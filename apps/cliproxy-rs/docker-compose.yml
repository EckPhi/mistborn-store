x-runtipi:
  schema_version: 2

services:
  cliproxy-rs:
    image: ghcr.io/vayungodara/cliproxy-rs:0.4.5
    x-runtipi:
      is_main: true
      internal_port: 8317
    depends_on:
      cliproxy-rs-permissions:
        condition: service_healthy
    entrypoint:
      - /bin/sh
      - -ec
      - |
        umask 077
        mkdir -p /data/auth /data/plugins

        if [ ! -s /data/keys.env ]; then
          if [ -s /data/config.yaml ]; then
            echo 'Existing config found. Restore keys.env to display the original startup keys.' >&2
          else
            client_key=$$(od -An -N24 -tx1 /dev/urandom | tr -d ' \n')
            management_key=$$(od -An -N24 -tx1 /dev/urandom | tr -d ' \n')
            test "$${#client_key}" -eq 48
            test "$${#management_key}" -eq 48
            printf 'CLIPROXY_CLIENT_KEY=sk-%s\nCLIPROXY_MANAGEMENT_KEY=%s\n' \
              "$$client_key" "$$management_key" > /data/keys.env.tmp
            mv /data/keys.env.tmp /data/keys.env
          fi
        fi

        if [ ! -s /data/config.yaml ]; then
          client_key=$$(sed -n 's/^CLIPROXY_CLIENT_KEY=//p' /data/keys.env)
          management_key=$$(sed -n 's/^CLIPROXY_MANAGEMENT_KEY=//p' /data/keys.env)
          test -n "$$client_key"
          test -n "$$management_key"
          cat > /data/config.yaml.tmp <<CONFIG
        server:
          host: "0.0.0.0"
          port: 8317
        access:
          api-keys:
            - "$$client_key"
        management:
          allow-remote: true
          secret-key: "$$management_key"
        oauth:
          auth-dir: "/data/auth"
        plugins:
          enabled: true
          dir: "/data/plugins"
        CONFIG
          mv /data/config.yaml.tmp /data/config.yaml
        fi

        if [ -s /data/keys.env ]; then
          grep -E '^CLIPROXY_(CLIENT|MANAGEMENT)_KEY=' /data/keys.env
        fi
        exec /usr/local/bin/cliproxy --config /data/config.yaml
    volumes:
      - ${APP_DATA_DIR}/data:/data

  cliproxy-rs-permissions:
    image: busybox:1.38.0
    command:
      - /bin/sh
      - -ec
      - |
        rm -f /tmp/ready
        chown -R 10001:10001 /data
        chmod 0700 /data
        touch /tmp/ready
        while :; do sleep 3600; done
    healthcheck:
      test: [CMD, test, -f, /tmp/ready]
      interval: 5s
      timeout: 3s
      retries: 12
    volumes:
      - ${APP_DATA_DIR}/data:/data
