x-runtipi:
  schema_version: 2

services:
  pizza-lunch-bot:
    image: ghcr.io/eckphi/pizza-lunch-bot:0.3.1
    environment:
      TELEGRAM_BOT_TOKEN: ${PIZZA_LUNCH_BOT_TOKEN}
      LUNCH_TIME_ZONE: ${PIZZA_LUNCH_BOT_TIME_ZONE:-Europe/Vienna}
      LUNCH_STATE_FILE: /data/lunch-state.json
      PIZZA_MINI_APP_SHORT_NAME: ${PIZZA_LUNCH_BOT_MINI_APP_SHORT_NAME:-}
      PIZZA_MINI_APP_LISTEN: 0.0.0.0:8080
      PIZZA_ADMIN_TOKEN: ${PIZZA_LUNCH_BOT_ADMIN_TOKEN:?Runtipi must generate an admin token}
      PIZZA_ADMIN_LISTEN: 0.0.0.0:8081
    volumes:
      - ${APP_DATA_DIR}/data:/data
    depends_on:
      pizza-lunch-bot-permissions:
        condition: service_healthy
    x-runtipi:
      is_main: true
      internal_port: 8081

  pizza-lunch-bot-permissions:
    image: ghcr.io/eckphi/pizza-lunch-bot:0.3.1
    user: "0:0"
    entrypoint:
      - /bin/sh
      - -ec
      - |
        chown 10001:10001 /data
        chmod 0700 /data
        touch /tmp/ready
        exec sleep infinity
    network_mode: none
    volumes:
      - ${APP_DATA_DIR}/data:/data
    healthcheck:
      test: ["CMD", "test", "-f", "/tmp/ready"]
      interval: 5s
      timeout: 3s
      retries: 12
