# Telegraf configuration shipped with the mistborn-store runtipi app.
#
# The ${TELEGRAF_INFLUX_*} variables are substituted by telegraf from the
# environment and are set in the runtipi app settings. Feel free to edit
# this file (app-data/data/config/telegraf.conf) — restart the app to apply.

[agent]
  interval = "30s"
  round_interval = true
  flush_interval = "30s"
  omit_hostname = false

# Output: InfluxDB 2.x. Point this at the InfluxDB runtipi app or any other
# InfluxDB 2.x instance. Remove or replace with e.g. outputs.influxdb (1.x),
# outputs.prometheus_client, or an ILP output for QuestDB.
[[outputs.influxdb_v2]]
  urls = ["${TELEGRAF_INFLUX_URL}"]
  token = "${TELEGRAF_INFLUX_TOKEN}"
  organization = "${TELEGRAF_INFLUX_ORG}"
  bucket = "${TELEGRAF_INFLUX_BUCKET}"

# Host system metrics. The host filesystem is mounted read-only at /hostfs
# and the HOST_* environment variables make these plugins report the host,
# not the container.
[[inputs.cpu]]
  percpu = true
  totalcpu = true
  collect_cpu_time = false
  report_active = false

[[inputs.mem]]

[[inputs.swap]]

[[inputs.system]]

[[inputs.processes]]

[[inputs.disk]]
  ignore_fs = ["tmpfs", "devtmpfs", "devfs", "iso9660", "overlay", "aufs", "squashfs"]

[[inputs.diskio]]

[[inputs.net]]
  ignore_protocol_stats = true
