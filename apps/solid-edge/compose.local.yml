services:
  solid-edge:
    image: solid-edge-webtop:0.1.0
    pull_policy: never
    platform: linux/amd64
    shm_size: 1gb
    environment:
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
      TZ: ${TZ:-Etc/UTC}
      CUSTOM_USER: ${DESKTOP_USER:?Set DESKTOP_USER}
      PASSWORD: ${DESKTOP_PASSWORD:?Set DESKTOP_PASSWORD}
      FILE_MANAGER_PATH: /config/uploads
      PIXELFLUX_WAYLAND: "false"
      START_DOCKER: "false"
    ports:
      - "127.0.0.1:3001:3001"
    volumes:
      - ${SE_STATE_DIR:?Set absolute private SE_STATE_DIR}/config:/config
      - ${SE_STATE_DIR}/projects:/projects
    restart: unless-stopped
