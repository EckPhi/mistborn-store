# seamtec-scraper: Weissenberg facility -> QuestDB (runtipi).
# Loaded when the app's "Config file" setting is /config/seamtec.toml.
# Precedence: CLI args > env vars (SEAMTEC_*) > this file > defaults.
# Username/password come from the app settings (environment) — do not put
# them here. Leave the app's "Sink" setting empty so these sinks apply.

[scraper]
base_url = "https://scc.seamtec.net"
facility = "weissenberg"
schedule = 60              # base interval (seconds)

[[entities]]
id = 2
name = "turbine"

[[entities]]
id = 4
name = "hydraulik-aggregat"

[[entities]]
id = 10
name = "leitapparat"

[[entities]]
id = 13
name = "laufrad"

[[entities]]
id = 16
name = "synchrongenerator"

[[entities]]
id = 19
name = "leistungsmessung-generator"

[[entities]]
id = 27
name = "stahlwasserbau"

[[entities]]
id = 29
name = "einlaufschuetz-1-2"

# ids 30-44 are currently unconfigured in the SCADA app ("Empty div Layout");
# scraped rarely so they start delivering automatically once configured.
[[entities]]
id = 30
name = "einlaufschuetz-1"
schedule = 3600

[[entities]]
id = 32
name = "einlaufschuetz-2"
schedule = 3600

[[entities]]
id = 34
name = "grundablassschuetz"
schedule = 3600

[[entities]]
id = 36
name = "schwemmgutklappe"
schedule = 3600

[[entities]]
id = 38
name = "sandspuelschuetz"
schedule = 3600

[[entities]]
id = 40
name = "stauklappe"
schedule = 3600

[[entities]]
id = 44
name = "baggerarm-rechenreiniger"
schedule = 3600

# dashboard: repeats subpage datapoints under entity=anlage -> scrape rarely
[[entities]]
id = 1
name = "anlage"
schedule = 300

[errors]
enabled = true
schedule = 120

[events]
enabled = true
schedule = 300

[notify]                   # failure notifications via apprise (optional)
# urls = ["tgram://bottoken/chatid"]
# min_interval = 300

# QuestDB app (this store) over the shared runtipi network: the scraper
# reaches the database by container name, no host IP needed. Full snapshot
# every tick -> regular time series for Grafana (query via port 8812,
# PostgreSQL wire protocol, or the web console on 9000).
# All metrics land in one "seamtec" table (metric name as 'name' symbol);
# writes are batched to keep QuestDB transactions large:
#   SELECT time, value FROM seamtec WHERE name = 'wirkleistung' AND entity = 'turbine'
[[sinks]]
type = "questdb"         # official questdb client, auto-batched writes
host = "questdb"
port = 9009
protocol = "tcp"
only_changes = false
table = "seamtec"
flush_rows = 500         # client flushes once 500 rows buffered ...
flush_interval = 30      # ... or the oldest buffered row is 30 s old

# change-only copy in the container logs (docker logs / runtipi log viewer)
[[sinks]]
type = "stdout"
only_changes = true
