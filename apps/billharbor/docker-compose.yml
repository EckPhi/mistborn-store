x-runtipi:
  schema_version: 2
services:
  billharbor-init:
    image: eckphi/billharbor:0.5.0a21001
    user: "0:0"
    entrypoint:
      - python
      - -c
      - |
        import json, os, time
        from contextlib import redirect_stdout
        from pathlib import Path
        os.umask(0o077)
        Path('/tmp/ready').unlink(missing_ok=True)
        for name in ('state', 'config', 'secrets'):
            root = Path('/') / name
            root.mkdir(exist_ok=True)
            os.chown(root, 10001, 10001)
            for directory, children, files in os.walk(root, followlinks=False):
                for item in children + files:
                    os.chown(Path(directory) / item, 10001, 10001, follow_symlinks=False)
        Path('/secrets').chmod(0o700)
        os.setgroups([])
        os.setgid(10001)
        os.setuid(10001)
        from billharbor.service.config import ServiceConfig
        from billharbor.service.app import Application
        config = Path('/config/service.json')
        if not config.exists():
            # Never reinterpret lost deployment metadata as a fresh installation.
            if any(Path('/state').iterdir()) or any(Path('/secrets').iterdir()):
                raise RuntimeError('Existing state or secrets require deployment recovery.')
            config.write_text(json.dumps({
                'public_origin': os.environ['BILLHARBOR_PUBLIC_ORIGIN'],
                'state_dir': '/state',
                'key_files': {'initial': '/secrets/credential-key'},
                'current_key_id': 'initial',
                'authentication': {'mode': 'local'},
                'accounts': [], 'grants': [], 'destinations': [],
                'plugins': {'administrators': []}
            }, indent=2))
        elif not Path('/state/state.sqlite3').is_file():
            raise RuntimeError('Existing configuration without its database requires recovery.')
        value = json.loads(config.read_text())
        value['public_origin'] = os.environ['BILLHARBOR_PUBLIC_ORIGIN']
        # The main API now owns its temporary startup claim. Keep every other
        # deployment policy and leave the old protected token file untouched.
        if isinstance(value.get('setup'), dict):
            value['setup'].pop('token_file', None)
        config.write_text(json.dumps(value, indent=2))
        settings = ServiceConfig.load(config)
        # Initialize the installation exactly once before API workers can race
        # to create a fresh database. Existing users/policies/keys are untouched.
        # This container has its own temporary directory; its claim is not the
        # serving API claim. Only the main API logs the usable startup token.
        with open(os.devnull, 'w') as quiet, redirect_stdout(quiet):
            application = Application(settings)
        if application.installation.status()['stage'] == 'blocked':
            raise RuntimeError('Installation state requires deployment recovery.')
        if not settings.setup_token_file:
            settings.vault(application.store)
        application.close()
        Path('/tmp/ready').touch()
        while True:
            time.sleep(3600)
    environment:
      BILLHARBOR_PUBLIC_ORIGIN: ${APP_PROTOCOL}://${APP_DOMAIN}
    volumes:
      - ${APP_DATA_DIR}/state:/state
      - ${APP_DATA_DIR}/config:/config
      - ${APP_DATA_DIR}/secrets:/secrets
    healthcheck:
      test: test -f /tmp/ready || exit 1
      interval: 5s
      timeout: 3s
      start_period: 5s
      retries: 12
  billharbor:
    image: eckphi/billharbor:0.5.0a21001
    user: "10001:10001"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    init: true
    pids_limit: 128
    mem_limit: 1g
    cpus: 1.0
    tmpfs:
      - /tmp:size=268435456,mode=1777,nosuid,nodev
    entrypoint: [gunicorn]
    command: ["billharbor.service.app:create_app()", "--bind=0.0.0.0:8080", "--workers=2", "--worker-class=gthread", "--threads=4", "--timeout=30", "--graceful-timeout=30", "--limit-request-line=4096", "--limit-request-fields=40", "--limit-request-field_size=4096", "--forwarded-allow-ips="]
    environment:
      BILLHARBOR_CONFIG: /config/service.json
    volumes:
      - ${APP_DATA_DIR}/state:/state
      - ${APP_DATA_DIR}/config:/config:ro
      - ${APP_DATA_DIR}/secrets:/secrets
    depends_on:
      billharbor-init:
        condition: service_healthy
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health/ready', timeout=3).close()"]
      interval: 15s
      timeout: 5s
      retries: 3
    x-runtipi:
      is_main: true
      internal_port: 8080
  billharbor-worker:
    image: eckphi/billharbor:0.5.0a21001
    user: "10001:10001"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    init: true
    network_mode: none
    pids_limit: 128
    mem_limit: 1g
    cpus: 1.0
    tmpfs:
      - /tmp:size=268435456,mode=1777,nosuid,nodev
    entrypoint: [python, -c]
    command:
      - |
        import os, time
        from billharbor.service.config import ServiceConfig
        settings = ServiceConfig.load('/config/service.json')
        store = settings.open_store()
        while True:
            with store._connection() as connection:
                row = connection.execute('SELECT stage FROM installation_setup WHERE id=1').fetchone()
            if row is None or row['stage'] == 'complete':
                break
            time.sleep(5)
        os.execvp('billharbor-service', ['billharbor-service', 'worker'])
    environment:
      BILLHARBOR_CONFIG: /config/service.json
    volumes:
      - ${APP_DATA_DIR}/state:/state
      - ${APP_DATA_DIR}/config:/config:ro
      - ${APP_DATA_DIR}/secrets:/secrets:ro
    depends_on:
      billharbor-init:
        condition: service_healthy
    stop_grace_period: 15s
    healthcheck:
      test: [CMD, billharbor-service, worker-health]
      interval: 10s
      timeout: 5s
      start_period: 15s
      retries: 3
