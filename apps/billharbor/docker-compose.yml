x-runtipi:
  schema_version: 2
services:
  billharbor-init:
    image: eckphi/billharbor:0.5.0b17001
    user: "0:0"
    entrypoint:
      - python
      - -c
      - |
        import json, os, time
        from pathlib import Path
        os.umask(0o077)
        Path('/tmp/ready').unlink(missing_ok=True)
        for name in ('state', 'config', 'secrets'):
            root = Path('/') / name
            root.mkdir(exist_ok=True)
            os.chown(root, 10001, 10001)
            for directory, children, files in os.walk(root, followlinks=False):
                for item in children + files:
                    os.chown(Path(directory) / item, 10001, 10001, follow_symlinks=False)
        key = Path('/secrets/credential-key')
        if not key.exists():
            key.write_bytes(bytes.fromhex(os.environ['BILLHARBOR_ENCRYPTION_KEY']))
        key.chmod(0o600)
        os.chown(key, 10001, 10001)
        os.setgroups([])
        os.setgid(10001)
        os.setuid(10001)
        from billharbor.service.config import ServiceConfig
        from billharbor.service.cli import provision
        from billharbor.local_users import LocalUsers
        from billharbor.access import AccessControl
        config = Path('/config/service.json')
        if not config.exists():
            config.write_text(json.dumps({
                'public_origin': os.environ['BILLHARBOR_PUBLIC_ORIGIN'],
                'state_dir': '/state',
                'key_files': {'initial': '/secrets/credential-key'},
                'current_key_id': 'initial',
                'authentication': {'mode': 'local'},
                'accounts': [], 'grants': [], 'destinations': [],
                'plugins': {'administrators': []}
            }, indent=2))
        value = json.loads(config.read_text())
        value['public_origin'] = os.environ['BILLHARBOR_PUBLIC_ORIGIN']
        value['authentication'] = {'mode': 'local'}
        config.write_text(json.dumps(value, indent=2))
        settings = ServiceConfig.load(config)
        store = settings.open_store()
        settings.vault(store)
        marker = Path('/state/.runtipi-provisioned')
        if not marker.exists():
            provision(settings)
            marker.touch()
        with store._connection() as connection:
            has_users = connection.execute('SELECT 1 FROM local_users LIMIT 1').fetchone()
        if not has_users:
            password_file = Path('/secrets/bootstrap-password')
            if password_file.exists():
                from billharbor.auth import _read_secret_file
                password = _read_secret_file(password_file)
            else:
                password = os.environ['BILLHARBOR_ADMIN_PASSWORD']
            user = LocalUsers(store).bootstrap(os.environ['BILLHARBOR_ADMIN_USERNAME'], password)
            AccessControl(store).grant(user['subject_id'], 'default', 'admin', actor_id='deployment')
            admins = value.setdefault('plugins', {}).setdefault('administrators', [])
            admins.append(user['subject_id'])
            config.write_text(json.dumps(value, indent=2))
        Path('/tmp/ready').touch()
        while True:
            time.sleep(3600)
    environment:
      BILLHARBOR_PUBLIC_ORIGIN: ${APP_PROTOCOL}://${APP_DOMAIN}
      BILLHARBOR_ADMIN_USERNAME: ${BILLHARBOR_ADMIN_USERNAME}
      BILLHARBOR_ADMIN_PASSWORD: ${BILLHARBOR_ADMIN_PASSWORD}
      BILLHARBOR_ENCRYPTION_KEY: ${BILLHARBOR_ENCRYPTION_KEY}
    volumes:
      - ${APP_DATA_DIR}/state:/state
      - ${APP_DATA_DIR}/config:/config
      - ${APP_DATA_DIR}/secrets:/secrets
    healthcheck:
      test: test -f /tmp/ready || exit 1
      interval: 5s
      timeout: 3s
      start_period: 5s
      retries: 12
  billharbor:
    image: eckphi/billharbor:0.5.0b17001
    user: "10001:10001"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    init: true
    pids_limit: 128
    mem_limit: 1g
    cpus: 1.0
    tmpfs:
      - /tmp:size=268435456,mode=1777,nosuid,nodev
    entrypoint: [gunicorn]
    command: ["billharbor.service.app:create_app()", "--bind=0.0.0.0:8080", "--workers=2", "--worker-class=gthread", "--threads=4", "--timeout=30", "--graceful-timeout=30", "--limit-request-line=4096", "--limit-request-fields=40", "--limit-request-field_size=4096", "--forwarded-allow-ips="]
    environment:
      BILLHARBOR_CONFIG: /config/service.json
    volumes:
      - ${APP_DATA_DIR}/state:/state
      - ${APP_DATA_DIR}/config:/config:ro
      - ${APP_DATA_DIR}/secrets:/secrets:ro
    depends_on:
      billharbor-init:
        condition: service_healthy
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health/ready', timeout=3).close()"]
      interval: 15s
      timeout: 5s
      retries: 3
    x-runtipi:
      is_main: true
      internal_port: 8080
  billharbor-worker:
    image: eckphi/billharbor:0.5.0b17001
    user: "10001:10001"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    init: true
    network_mode: none
    pids_limit: 128
    mem_limit: 1g
    cpus: 1.0
    tmpfs:
      - /tmp:size=268435456,mode=1777,nosuid,nodev
    command: [worker]
    environment:
      BILLHARBOR_CONFIG: /config/service.json
    volumes:
      - ${APP_DATA_DIR}/state:/state
      - ${APP_DATA_DIR}/config:/config:ro
      - ${APP_DATA_DIR}/secrets:/secrets:ro
    depends_on:
      billharbor-init:
        condition: service_healthy
    stop_grace_period: 15s
    healthcheck:
      test: [CMD, billharbor-service, worker-health]
      interval: 10s
      timeout: 5s
      start_period: 15s
      retries: 3
