x-runtipi:
  schema_version: 2
services:
  ief-bookkeeping-permissions:
    image: eckphi/ief-bookkeeping-service:v0.9.5
    user: "0:0"
    entrypoint:
      - python
      - -c
      - |
        import os
        import time
        from pathlib import Path
        root = Path('/data')
        root.mkdir(parents=True, exist_ok=True)
        os.chown(root, 1000, 1000)
        for directory, children, files in os.walk(root, followlinks=False):
            for name in children + files:
                os.chown(Path(directory) / name, 1000, 1000, follow_symlinks=False)
        Path('/tmp/ready').touch()
        while True:
            time.sleep(3600)
    volumes:
      - ${APP_DATA_DIR}/data:/data
    healthcheck:
      test: test -f /tmp/ready || exit 1
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
  ief-bookkeeping:
    image: eckphi/ief-bookkeeping-service:v0.9.5
    user: "1000:1000"
    environment:
      IEF_DATABASE: /data/workflow.sqlite3
      IEF_PUBLIC_ORIGIN: ${IEF_PUBLIC_ORIGIN}
    volumes:
      - ${APP_DATA_DIR}/data:/data
    depends_on:
      ief-bookkeeping-permissions:
        condition: service_healthy
    x-runtipi:
      is_main: true
      internal_port: 8080
