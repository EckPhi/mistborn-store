x-runtipi:
  schema_version: 2
services:
  omnigent-permissions:
    image: busybox:1.38.0
    network_mode: none
    command: [sh, -ec, 'mkdir -p /data/artifacts; chown 1000:1000 /data /data/artifacts; touch /tmp/ready; while :; do sleep 3600; done']
    volumes:
      - ${APP_DATA_DIR}/server:/data
    healthcheck:
      test: [CMD-SHELL, test -f /tmp/ready]
      interval: 5s
      timeout: 3s
      retries: 12
  omnigent-postgres:
    image: postgres:17.11-bookworm
    environment:
      POSTGRES_DB: omnigent
      POSTGRES_USER: omnigent
      POSTGRES_PASSWORD: ${OMNIGENT_DB_PASSWORD}
    volumes:
      - ${APP_DATA_DIR}/postgres:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, pg_isready -U omnigent -d omnigent]
      interval: 5s
      timeout: 5s
      start_period: 30s
      retries: 30
  omnigent:
    image: ghcr.io/omnigent-ai/omnigent-server:v0.17.0
    user: '1000:1000'
    environment:
      HOME: /data
      DATABASE_URL: postgresql+psycopg://omnigent:${OMNIGENT_DB_PASSWORD}@omnigent-postgres:5432/omnigent
      ARTIFACT_DIR: /data/artifacts
      HOST: 0.0.0.0
      PORT: '8000'
      OMNIGENT_CONFIG_HOME: /data
      OMNIGENT_ADMIN_CREDENTIALS_PATH: /data/admin-credentials
      OMNIGENT_AUTH_ENABLED: '1'
      OMNIGENT_AUTH_PROVIDER: accounts
      OMNIGENT_ACCOUNTS_COOKIE_SECRET: ${OMNIGENT_COOKIE_SECRET}
      OMNIGENT_ACCOUNTS_BASE_URL: ${OMNIGENT_BASE_URL}
      OMNIGENT_ACCOUNTS_AUTO_OPEN: '0'
      OMNIGENT_ANALYTICS: '0'
      OMNIGENT_DISABLE_TELEMETRY: 'true'
      DO_NOT_TRACK: '1'
      CODER_URL: ${OMNIGENT_CODER_URL:-}
      CODER_API_TOKEN: ${OMNIGENT_CODER_API_TOKEN:-}
      MLFLOW_TRACKING_URI: ${OMNIGENT_MLFLOW_TRACKING_URI:-}
    volumes:
      - ${APP_DATA_DIR}/server:/data
    depends_on:
      omnigent-postgres:
        condition: service_healthy
      omnigent-permissions:
        condition: service_healthy
    healthcheck:
      test: [CMD, curl, -fsS, http://127.0.0.1:8000/health]
      interval: 10s
      timeout: 5s
      start_period: 60s
      retries: 30
    x-runtipi:
      is_main: true
      internal_port: 8000
