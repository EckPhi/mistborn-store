x-runtipi:
  schema_version: 2

services:
  cliproxyapi:
    image: eceasy/cli-proxy-api:v8.0.67
    x-runtipi:
      is_main: true
      internal_port: 8317
    environment:
      TZ: ${TZ}
      MANAGEMENT_PASSWORD: ${CLIPROXYAPI_MANAGEMENT_PASSWORD}
    entrypoint:
      - /bin/sh
      - -c
      - >-
        mkdir -p /data/auths;
        if [ ! -s /data/config.yaml ]; then
        printf '%s\n'
        'config-version: 8'
        'server:'
        '  port: 8317'
        'management:'
        '  allow-remote: true'
        'access:'
        '  api-keys:'
        '    - "sk-cpa-${CLIPROXYAPI_API_KEY_MATERIAL}"'
        'oauth:'
        '  auth-dir: "/data/auths"'
        'observability:'
        '  usage:'
        '    usage-statistics-enabled: true'
        > /data/config.yaml;
        fi;
        exec /CLIProxyAPI/CLIProxyAPI -config /data/config.yaml
    volumes:
      - ${APP_DATA_DIR}/data:/data
    healthcheck:
      test:
        - CMD
        - bash
        - -c
        - "exec 3<>/dev/tcp/127.0.0.1/8317 && printf 'GET /healthz HTTP/1.0\\r\\n\\r\\n' >&3 && head -n 1 <&3 | grep -q ' 200 '"
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
