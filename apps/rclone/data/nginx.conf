map $http_x_forwarded_proto $rclone_public_scheme {
    default $http_x_forwarded_proto;
    "" $scheme;
}

server {
    listen 5572;
    server_name _;
    absolute_redirect off;

    location = / {
        return 302 /login?url=$rclone_public_scheme://$http_host/api/;
    }

    location /api/ {
        proxy_pass http://rclone:5533/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $rclone_public_scheme;
        proxy_set_header Authorization $http_authorization;
    }

    location / {
        proxy_pass http://rclone:5522;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $rclone_public_scheme;
    }
}
