x-runtipi:
  schema_version: 2

services:
  rclone-proxy:
    image: nginx:1.30.5-alpine
    depends_on:
      rclone-ui:
        condition: service_started
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -eu

        cat > /tmp/default.conf.template <<'NGINX_CONFIG'
        map $$http_x_forwarded_proto $$rclone_public_scheme {
            default $$http_x_forwarded_proto;
            "" $$scheme;
        }

        server {
            listen 5572;
            server_name _;
            absolute_redirect off;

            location = / {
                return 302 /login;
            }

            location /api/ {
                proxy_pass http://unix:/run/rclone/rc.sock:/;
                proxy_http_version 1.1;
                proxy_hide_header WWW-Authenticate;
                proxy_set_header Host $$host;
                proxy_set_header X-Forwarded-For $$proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto $$rclone_public_scheme;
                proxy_set_header Authorization $$http_authorization;
            }

            location / {
                proxy_pass http://rclone-ui:5522;
                proxy_http_version 1.1;
                proxy_set_header Accept-Encoding "";
                proxy_set_header Host $$host;
                proxy_set_header X-Forwarded-For $$proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto $$rclone_public_scheme;
                sub_filter_once on;
                sub_filter_types text/html;
                sub_filter '</head>' '<script>(()=>{const key="lite-auth-store";let value={};try{value=JSON.parse(localStorage.getItem(key)||"{}")||{}}catch{}const state=value.state&&typeof value.state==="object"?value.state:{};state.url=location.origin+"/api/";state.user=state.user||"";state.pass=state.pass||"";state.bannerDismissed=Boolean(state.bannerDismissed);value.state=state;value.version=Number.isInteger(value.version)?value.version:0;localStorage.setItem(key,JSON.stringify(value))})()</script></head>';
            }
        }
        NGINX_CONFIG

        cp /tmp/default.conf.template /etc/nginx/conf.d/default.conf
        socket_gid=$$(stat -c '%g' /run/rclone/rc.sock)
        socket_group=$$(awk -F: -v gid="$$socket_gid" '$$3 == gid { print $$1; exit }' /etc/group)
        if [ -z "$$socket_group" ]; then
          socket_group=rclone-socket
          printf 'rclone-socket:x:%s:nginx\n' "$$socket_gid" >> /etc/group
        fi
        sed -i "s/^user nginx;.*/user nginx $$socket_group;/" /etc/nginx/nginx.conf

        exec nginx -g 'daemon off;'
    volumes:
      - type: bind
        source: /run/rclone
        target: /run/rclone
        read_only: true
    x-runtipi:
      is_main: true
      internal_port: 5572

  rclone-ui:
    image: rclone/rclone:1.75.1
    command:
      - gui
      - --addr
      - 0.0.0.0:5522
      - --api-addr
      - 127.0.0.1:5533
      - --no-auth
      - --no-open-browser
    environment:
      RCLONE_LOG_LEVEL: ERROR
