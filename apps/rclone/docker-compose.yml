x-runtipi:
  schema_version: 2

services:
  rclone-proxy:
    image: nginx:1.30.5-alpine
    depends_on:
      rclone:
        condition: service_started
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -eu

        cat > /etc/nginx/conf.d/default.conf <<'NGINX_CONFIG'
        map $$http_x_forwarded_proto $$rclone_public_scheme {
            default $$http_x_forwarded_proto;
            "" $$scheme;
        }

        server {
            listen 5572;
            server_name _;
            absolute_redirect off;

            location = / {
                return 302 /login?url=$$rclone_public_scheme://$$http_host/api/;
            }

            location = /login {
                if ($$arg_url = "") {
                    return 302 /login?url=$$rclone_public_scheme://$$http_host/api/;
                }

                proxy_pass http://rclone:5522;
                proxy_http_version 1.1;
                proxy_set_header Host $$host;
                proxy_set_header X-Forwarded-For $$proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto $$rclone_public_scheme;
            }

            location /api/ {
                proxy_pass http://rclone:5533/;
                proxy_http_version 1.1;
                proxy_hide_header WWW-Authenticate;
                proxy_set_header Host $$host;
                proxy_set_header X-Forwarded-For $$proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto $$rclone_public_scheme;
                proxy_set_header Authorization $$http_authorization;
            }

            location / {
                proxy_pass http://rclone:5522;
                proxy_http_version 1.1;
                proxy_set_header Host $$host;
                proxy_set_header X-Forwarded-For $$proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto $$rclone_public_scheme;
            }
        }
        NGINX_CONFIG

        exec nginx -g 'daemon off;'
    x-runtipi:
      is_main: true
      internal_port: 5572

  rclone:
    image: rclone/rclone:1.75.1
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -eu

        rclone gui \
          --config /config/rclone/rclone.conf \
          --cache-dir /cache \
          --addr 0.0.0.0:5522 \
          --api-addr 0.0.0.0:5533 \
          --rc-serve \
          --no-open-browser &
        rcd_pid=$$!

        shutdown() {
          kill "$$rcd_pid" 2>/dev/null || true
          wait 2>/dev/null || true
        }
        trap shutdown EXIT TERM INT

        attempt=0
        until rclone rc \
          --url http://127.0.0.1:5533 \
          --no-output core/pid; do
          attempt=$$((attempt + 1))
          if [ "$$attempt" -ge 60 ]; then
            echo "rclone remote control did not become ready" >&2
            exit 1
          fi
          sleep 1
        done

        remote_name=$${RCLONE_MOUNT_REMOTE%%:*}
        if [ -n "$$remote_name" ] && rclone listremotes --config /config/rclone/rclone.conf | grep -Fxq "$$remote_name:"; then
          mkdir -p /data/cloud
          rclone rc \
            --url http://127.0.0.1:5533 \
            --no-output mount/mount \
            fs="$$RCLONE_MOUNT_REMOTE" \
            mountPoint=/data/cloud \
            mountType=mount \
            allow_other=true \
            uid="$$RCLONE_MOUNT_UID" \
            gid="$$RCLONE_MOUNT_GID" \
            umask=002 \
            vfs_cache_mode=full \
            vfs_cache_max_size="$$RCLONE_VFS_CACHE_SIZE" \
            vfs_cache_max_age=168h \
            dir_cache_time=24h \
            poll_interval=1m \
            buffer_size=32M
        else
          echo "Configured remote '$$RCLONE_MOUNT_REMOTE' does not exist yet; create it in the web interface, then restart the app."
        fi

        wait "$$rcd_pid"
    environment:
      RCLONE_RC_USER: ${RCLONE_GUI_USERNAME}
      RCLONE_RC_PASS: ${RCLONE_GUI_PASSWORD}
      RCLONE_LOG_LEVEL: ERROR
      RCLONE_MOUNT_REMOTE: ${RCLONE_MOUNT_REMOTE}
      RCLONE_VFS_CACHE_SIZE: ${RCLONE_VFS_CACHE_SIZE}
      RCLONE_MOUNT_UID: ${UID:-0}
      RCLONE_MOUNT_GID: ${GID:-0}
      TZ: ${TZ}
    devices:
      - /dev/fuse:/dev/fuse
    cap_add:
      - SYS_ADMIN
    security_opt:
      - apparmor:unconfined
    volumes:
      - ${APP_DATA_DIR}/config:/config
      - ${APP_DATA_DIR}/cache:/cache
      - type: bind
        source: ${ROOT_FOLDER_HOST}/media
        target: /data
        bind:
          propagation: rshared
    x-runtipi:
      add_to_main_network: true
