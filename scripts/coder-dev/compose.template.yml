# Generated by scripts/coder-dev/package.py. Edit source files, then regenerate.
x-runtipi:
  schema_version: 2
services:
  coder-dev-assets:
    image: ghcr.io/coder/coder:v2.36.6
    network_mode: none
    user: "0:0"
    entrypoint: [/bin/sh, -ec]
    command:
      - |
        rm -f /tmp/ready
        mkdir -p /data/runtime /data/coder /data/bootstrap /data/workspaces /data/caches /data/snapshots
        mkdir -p /workspaces /caches
        printf '%s' '@BUNDLE@' | base64 -d | tar -xz -C /data/runtime
        chown 1000:1000 /data/coder /data/bootstrap /data/snapshots /workspaces /caches
        chmod 700 /data/bootstrap
        touch /tmp/ready
        while :; do sleep 3600; done
    volumes:
      - ${APP_DATA_DIR}:/data
      - workspace-data:/workspaces
      - workspace-caches:/caches
    healthcheck:
      test: [CMD-SHELL, test -f /tmp/ready]
      interval: 5s
      timeout: 3s
      retries: 12
  coder-dev-postgres:
    image: postgres:17.11-bookworm
    environment:
      POSTGRES_DB: coder
      POSTGRES_USER: coder
      POSTGRES_PASSWORD: ${CODER_DEV_DB_PASSWORD}
    volumes:
      - ${APP_DATA_DIR}/postgres:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, pg_isready -U coder -d coder]
      interval: 5s
      timeout: 5s
      start_period: 30s
      retries: 30
  coder-dev:
    image: ghcr.io/coder/coder:v2.36.6
    user: "0:0"
    entrypoint: [/bin/sh, /runtime/bootstrap/server.sh]
    environment:
      CODER_HTTP_ADDRESS: 0.0.0.0:7080
      CODER_ACCESS_URL: ${APP_PROTOCOL}://${APP_DOMAIN}
      CODER_DEV_ACCESS_URL_OVERRIDE: ${CODER_DEV_ACCESS_URL_OVERRIDE:-}
      CODER_PG_CONNECTION_URL: postgres://coder:${CODER_DEV_DB_PASSWORD}@coder-dev-postgres:5432/coder?sslmode=disable
      CODER_TELEMETRY_ENABLE: "false"
      CODER_UPDATE_CHECK: "false"
      CODER_PROVISIONER_DAEMONS: "1"
      CODER_CONFIG_DIR: /home/coder/.config/coderv2
      HOME: /home/coder
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${APP_DATA_DIR}/coder:/home/coder
      - ${APP_DATA_DIR}/runtime:/runtime
    depends_on:
      coder-dev-assets:
        condition: service_healthy
      coder-dev-postgres:
        condition: service_healthy
    healthcheck:
      test: [CMD, curl, -fsS, http://127.0.0.1:7080/healthz]
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 30
    x-runtipi:
      is_main: true
      internal_port: 7080
  coder-dev-bootstrap:
    image: python:3.13.15-bookworm
    user: "1000:1000"
    entrypoint: [python3, /runtime/bootstrap/bootstrap.py]
    stop_grace_period: 30m
    environment:
      CODER_URL: http://coder-dev:7080
      CODER_DEV_ADMIN_USERNAME: ${CODER_DEV_ADMIN_USERNAME}
      CODER_DEV_ADMIN_EMAIL: ${CODER_DEV_ADMIN_EMAIL}
      CODER_DEV_ADMIN_PASSWORD: ${CODER_DEV_ADMIN_PASSWORD}
      CODER_DEV_WORKSPACE_NAME: ${CODER_DEV_WORKSPACE_NAME:-dev}
      CODER_DEV_GIT_NAME: ${CODER_DEV_GIT_NAME:-}
      CODER_DEV_GIT_EMAIL: ${CODER_DEV_GIT_EMAIL:-}
      CODER_DEV_DATA_ROOT: ${APP_DATA_DIR}
      CODER_DEV_DOCKER_APPARMOR_PROFILE: ${CODER_DEV_DOCKER_APPARMOR_PROFILE:-}
      CODER_DEV_AI_GATEWAY_URL: ${CODER_DEV_AI_GATEWAY_URL:-}
      CODER_DEV_AI_GATEWAY_ADMIN_KEY: ${CODER_DEV_AI_GATEWAY_ADMIN_KEY:-}
      CODER_DEV_AI_GATEWAY_MODELS: ${CODER_DEV_AI_GATEWAY_MODELS:-coding,fast}
      HOME: /state
      PYTHONDONTWRITEBYTECODE: "1"
    volumes:
      - ${APP_DATA_DIR}/runtime:/runtime:ro
      - ${APP_DATA_DIR}/bootstrap:/state
      - workspace-data:/workspaces
      - ${APP_DATA_DIR}/workspaces:/legacy-workspaces:ro
      - ${APP_DATA_DIR}/snapshots:/snapshots
    depends_on:
      coder-dev:
        condition: service_healthy
    healthcheck:
      test: [CMD, python3, -c, "from pathlib import Path; raise SystemExit(not Path('/tmp/ready').exists())"]
      interval: 10s
      timeout: 5s
      start_period: 30m
      retries: 3

volumes:
  workspace-data:
    name: coder-dev-workspaces
  workspace-caches:
    name: coder-dev-caches
